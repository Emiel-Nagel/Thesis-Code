[project]
name = "thesis-code"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "snntorch",
    "tonic",
    "tqdm",
    "matplotlib",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["thesis_code*"]